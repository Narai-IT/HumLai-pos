        <ellipse cx="200" cy="162" rx="68" ry="21" fill="#09090b" />
        <circle cx="185" cy="160" r="3" fill="#fef08a" />
        <circle cx="210" cy="164" r="3" fill="#ef4444" />
      

  <!-- Dark Slate Banner with Dish Title -->
