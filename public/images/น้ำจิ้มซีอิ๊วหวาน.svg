    </radialGradient>
    <radialGradient id="ballGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>
    <radialGradient id="ballGrad2" cx="35%" cy="35%" r="65%">
